[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bansoko"
dynamic = ["version"]
description = "Bansoko is a reimagined, space-themed clone of MS-DOS Soko-Ban from 1984 created in Python using Pyxel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Krzysztof Furtak", email = "contact@krzysztoffurtak.dev" },
]
keywords = ["game", "puzzle", "sokoban", "8-bit", "retro"]
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "pyxel>=2.9.9",
    "jsonschema>=4.26.0",
]

[project.urls]
Homepage = "https://github.com/kfurtak1024/bansoko"
Download = "https://kfurtak1024.itch.io/bansoko"
Issues = "https://github.com/kfurtak1024/bansoko/issues"

[project.scripts]
bansoko = "bansoko.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "pytest>=9.0.0",
    "pyinstaller>=6.22.2",
]

[tool.hatch.version]
path = "bansoko/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bansoko"]

[tool.hatch.build.targets.sdist]
include = ["bansoko", "resbuilder", "resources", "README.md", "LICENSE"]

[tool.mypy]
python_version = "3.11"

# jsonschema ships no py.typed marker. pyxel does as of 2.x, so it no
# longer needs an override.
[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true

[tool.pylint.basic]
good-names = ["i", "j", "k", "x", "y", "u", "v", "w", "h", "dx", "dy"]

[tool.pylint.typecheck]
# pyxel re-exports its API by star-importing a compiled binding, so pylint
# cannot resolve pyxel.* statically and reports every use as no-member.
# Suppressed here rather than via extension-pkg-allow-list so that linting
# never has to import the extension module. mypy still checks these calls
# for real: pyxel ships a py.typed marker.
generated-members = ["pyxel.*"]

[tool.pylint."messages control"]
# The game and the resource builder deliberately keep separate copies of
# the resource JSON schema; they describe the same format from opposite
# sides and are meant to be read independently.
disable = [
    "duplicate-code",
    # TODO comments are notes to the author, not build failures.
    "fixme",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

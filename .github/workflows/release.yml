name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to the version in the package)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-distributions:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact version: astral-sh/setup-uv stopped publishing
      # floating major tags after v7, so @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  build-binaries:
    name: Build ${{ matrix.channel }} binary
    runs-on: ${{ matrix.os }}
    # Job-level, not on the setup-uv step: a step's `env` lasts only for that
    # step, so the `uv sync` and `uv run` steps below -- the ones that actually
    # choose the interpreter PyInstaller freezes -- would never have seen it.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: linux
            binary: bansoko
          - os: windows-latest
            channel: windows
            binary: bansoko.exe
    steps:
      - uses: actions/checkout@v7

      # Deliberately no libsdl2 here. If SDL2 is installed on the build
      # machine, PyInstaller bundles that copy instead of the one shipped in
      # the pyxel wheel, and the binary inherits the build machine's glibc.
      - name: Install display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libegl1 libdrm2

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # Without an explicit version uv falls back to the runner's system
          # Python. On ubuntu-latest that is Ubuntu 24.04's build, whose
          # libpython requires GLIBC_2.38, which PyInstaller then bundles.
          # uv's own builds need only GLIBC_2.17.
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Linux binaries are built inside manylinux_2_28 so they run on any
      # glibc from 2.28 up, which is the floor pyxel's own wheels target.
      # Building on the runner directly ties the result to its glibc: the
      # first Linux build required GLIBC_2.38 and would not start on Ubuntu
      # 22.04, Debian 11 or RHEL 9.
      - name: Build standalone binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD":/src:ro -v "$PWD/dist":/out \
            quay.io/pypa/manylinux_2_28_x86_64 bash -c '
              set -e
              cp -r /src /work && cd /work && rm -rf .venv dist build
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip -q install uv
              export UV_PYTHON_INSTALL_DIR=/work/.pythons
              export UV_PYTHON_PREFERENCE=only-managed
              # uv.lock, not a hand-written package list. Installing loose
              # requirements here would freeze whatever versions PyPI happened
              # to be serving at release time into the binary players download,
              # bypassing every version CI actually tested -- and would silently
              # omit any runtime dependency later added to pyproject.toml,
              # producing a binary that dies with ModuleNotFoundError while all
              # checks stay green.
              uv sync --locked --python 3.12
              /work/.venv/bin/pyinstaller bansoko.spec --noconfirm \
                --distpath /work/dist --workpath /work/build
              cp /work/dist/bansoko /out/bansoko
              chmod 0755 /out/bansoko
            '

      - name: Build standalone binary (Windows)
        if: runner.os == 'Windows'
        run: uv run pyinstaller bansoko.spec --noconfirm

      # The regression test for the bug above: a binary that needs a newer
      # glibc than it should fails here with the same "GLIBC_x.yz not found"
      # error a player would see. --version needs no graphics, so this is a
      # pure portability check.
      - name: Check the binary runs on the oldest supported glibc
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist":/d:ro rockylinux:8 bash -c '
            set -e
            dnf -y -q install libdrm libX11 libXext libXrandr libXcursor \
              libXi mesa-libGL
            /d/bansoko --version
          '

      # A frozen build can compile cleanly and still fail to find its bundled
      # resources at startup. Never ship one without launching it first.
      - name: Verify the binary starts (Linux)
        if: runner.os == 'Linux'
        env:
          BANSOKO_FROZEN_BINARY: dist/${{ matrix.binary }}
          BANSOKO_REQUIRE_GRAPHICS: "1"
        run: xvfb-run -a uv run pytest tests/test_frozen_build.py -v

      # No OpenGL driver on Windows runners, so the launch check skips and only
      # the --version check runs. The resource-path bug it guards against comes
      # from bansoko.spec, which is shared, so the Linux job above catches it.
      - name: Verify the binary starts (Windows)
        if: runner.os == 'Windows'
        env:
          BANSOKO_FROZEN_BINARY: dist/${{ matrix.binary }}
        run: uv run pytest tests/test_frozen_build.py -v

      - uses: actions/upload-artifact@v7
        with:
          name: bansoko-${{ matrix.channel }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build-distributions, build-binaries]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bansoko
    permissions:
      # Required for trusted publishing; replaces the long-lived API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      # A version already on PyPI is not an error here. Uploads are permanent,
      # so if a later job fails the whole release has to be repeatable; without
      # this, re-running it dies on the distributions it already published.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true

  attach-to-release:
    name: Attach binaries to the release
    needs: build-binaries
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bansoko-*
          path: binaries/
      # Archives rather than bare executables: a browser will not offer to run
      # a downloaded .tar.gz or .zip, and the tar preserves the executable bit
      # that GitHub's artifact upload drops.
      - name: Package the binaries
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p release

          chmod +x binaries/bansoko-linux/bansoko
          tar -czf "release/bansoko-${version}-linux-x86-64.tar.gz" \
            -C binaries/bansoko-linux bansoko

          (cd binaries/bansoko-windows \
            && zip -q "$GITHUB_WORKSPACE/release/bansoko-${version}-win-x86-64.zip" \
                 bansoko.exe)

          ls -l release/

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # --repo is required: this job downloads artifacts but never checks
        # out the repository, so gh has no git remote to infer it from and
        # fails with "not a git repository".
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-itch:
    name: Publish to itch.io
    needs: build-binaries
    # Also reachable from a manual run, unlike the GitHub-release jobs, which
    # have no release to attach to. `inputs.version` is empty on a release
    # event, so the first clause covers that; on a manual run the push happens
    # only if a version was actually typed in, which keeps a dispatch that is
    # just rebuilding the binaries from publishing to the store by accident.
    if: github.event_name == 'release' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      # Before the artifacts are downloaded, not after: checkout cleans the
      # workspace and would take them with it.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bansoko-*
          path: binaries/

      - name: Check for a butler credential
        id: check
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "BUTLER_API_KEY is not set; skipping the itch.io upload." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install butler
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          curl -sSL -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push builds to itch.io
        if: steps.check.outputs.configured == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: kfurtak1024/bansoko
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"

          # A tagless manual run would otherwise push a build with an empty
          # user version, which cannot be corrected after the fact.
          if [ -z "$version" ]; then
            echo "::error::No version to publish; pass one to the manual run."
            exit 1
          fi

          # Portable builds -- a directory of loose files -- rather than the
          # archives attached to the GitHub release. This is the shape butler
          # is built around: the itch app installs and patches it, and browser
          # users are served a .zip that itch generates.
          #
          # The licence travels with the binary. MIT asks for that wherever the
          # software is redistributed, and it doubles as what keeps the build
          # multi-file: itch hands a build holding a single file straight to
          # the player as that bare file, so a lone binary would download as
          # `bansoko.exe`, unarchived and unnamed. With a second file present
          # itch wraps it instead, under <game-slug>-<channel>.zip.
          #
          # Channel names are permanent. itch derives the download name from
          # them -- <game-slug>-<channel>.zip, so bansoko-win-x86-64.zip -- and
          # patching lasts only as long as the name stays put. They deliberately
          # carry no version: a channel always serves its latest build, so a
          # version in the name would advertise a choice the page does not
          # offer. The version reaches players through --userversion, which
          # itch shows next to the download.
          #
          # It is the platform substring, "linux" or "win", that tags an upload
          # for a platform. The architecture suffix is cosmetic -- itch has no
          # architecture tagging -- but it leaves room for a second arch later
          # without renaming, which a channel cannot survive.

          cp LICENSE binaries/bansoko-linux/
          cp LICENSE binaries/bansoko-windows/

          # Restores the executable bit, which GitHub's artifact upload drops.
          # Without it the Linux build installs as a plain file that will not
          # start. No equivalent is needed for the .exe.
          chmod +x binaries/bansoko-linux/bansoko

          # No "skip if the directory is missing" guard: if a platform failed
          # to build, publishing the other one alone would leave the page
          # advertising a release that is only half there.
          ./butler push binaries/bansoko-linux \
            "${ITCH_TARGET}:linux-x86-64" --userversion "$version"
          ./butler push binaries/bansoko-windows \
            "${ITCH_TARGET}:win-x86-64" --userversion "$version"
